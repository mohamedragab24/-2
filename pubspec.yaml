name: masar_app
description: تطبيق مسار لمنصة الكورسات
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_storage: ^12.3.4
  cloud_functions: ^5.1.3

  # Navigation
  go_router: ^14.3.0

  # Deep linking (App Links / Universal Links)
  app_links: ^6.3.2

  # Video playback
  video_player: ^2.9.2

  # Screen-recording / screenshot protection (Android FLAG_SECURE)
  flutter_windowmanager: ^0.2.0

  # UI / fonts
  google_fonts: ^6.2.1
  cached_network_image: ^3.4.1

  # State management (kept lightweight)
  provider: ^6.1.2

  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
