plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
    id "dev.flutter.flutter-gradle-plugin"
    id "com.google.gms.google-services"
}

// Jitsi 11.6.0 bundles its own RTSP Media3 classes through react-native-video.
// Flutter video_player also brings androidx.media3:media3-exoplayer-rtsp, which
// causes duplicate RtspMediaSource classes during release builds. The app does
// not use Media3 RTSP directly, so exclude the duplicate module globally.
configurations.all {
    exclude group: "androidx.media3", module: "media3-exoplayer-rtsp"
}

android {
    namespace "com.Fahmani"
    compileSdk 35

    defaultConfig {
        applicationId "com.Fahmani"
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName "1.0.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    buildTypes {
        release {
            signingConfig signingConfigs.debug
        }
    }
}

flutter {
    source "../.."
}
